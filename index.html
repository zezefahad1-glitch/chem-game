<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مختبر التحدّي | نحو التفوّق التحصيلي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#12304a;--teal:#0f8b8d;--gold:#f2b632;--pink:#ff8fa3;--mint:#7fe0d8;--bg:#eefaf9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Cairo,Tahoma,sans-serif;background:linear-gradient(160deg,#e6f7f6,#fff7e3 60%,#ffe9ee);min-height:100vh;color:var(--navy);position:relative;overflow-x:hidden}
.bubbles span{position:fixed;border-radius:50%;background:rgba(15,139,141,.08);animation:fl 14s infinite linear;bottom:-60px;pointer-events:none}
@keyframes fl{to{transform:translateY(-115vh)}}
.wrap{max-width:760px;margin:auto;padding:14px 14px 40px;position:relative;z-index:1}
.top{background:linear-gradient(135deg,var(--navy),#1b5a7a 60%,var(--teal));color:#fff;border-radius:26px;padding:18px 16px 16px;text-align:center;box-shadow:0 10px 26px rgba(18,48,74,.25);position:relative;overflow:hidden}
.top:before{content:"⚛";position:absolute;font-size:150px;opacity:.07;left:-20px;top:-30px}
.top:after{content:"⚗";position:absolute;font-size:120px;opacity:.07;right:-10px;bottom:-30px}
.school{font-weight:800;font-size:15px;color:var(--mint)}
.title{font-weight:900;font-size:38px;line-height:1.2;margin:4px 0}.title b{color:var(--gold)}
.tag{display:inline-block;background:var(--gold);color:#4a2d00;font-weight:900;font-size:15px;border-radius:20px;padding:3px 16px;margin:2px 0 6px}
.sub{font-size:15px;font-weight:600}.sub2{font-size:15px;font-weight:800;color:var(--mint);margin-top:4px}
.names{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.names div{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:5px 12px;font-size:13px}.names b{color:var(--gold)}
.stats{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;background:#fff;border-radius:18px;padding:10px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.stat b{display:block;font-size:24px;color:var(--teal);font-weight:900}.stat span{font-size:12px;opacity:.7}
h2{font-size:18px;margin:16px 4px 8px;font-weight:800}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:0;border-radius:20px;padding:12px;cursor:pointer;font-family:inherit;text-align:right;color:#fff;box-shadow:0 7px 14px rgba(0,0,0,.14);position:relative;overflow:hidden}
.mode .em{font-size:30px;display:block}.mode b{font-size:15px;display:block;line-height:1.3}.mode small{font-size:12px;opacity:.95;display:block;line-height:1.5;margin-top:2px}
.m1{background:linear-gradient(135deg,#ff7a45,#ffb347)}.m2{background:linear-gradient(135deg,#7c4dff,#a98bff)}.m3{background:linear-gradient(135deg,#e84a6f,#ff8fa3)}.m4{background:linear-gradient(135deg,#f2b632,#ff9f43);color:#4a2d00}
.mode .done{position:absolute;left:8px;top:8px;background:#fff;color:#12a15b;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:22px;padding:14px 12px;color:#fff;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 8px 16px rgba(0,0,0,.12);border:0;font-family:inherit;text-align:right;transition:transform .15s}
.card:active,.mode:active{transform:scale(.96)}
.card .no{position:absolute;left:8px;top:-8px;font-size:70px;font-weight:900;opacity:.18}
.card .ic{font-size:34px;display:block}.card b{display:block;font-size:15px;line-height:1.35;margin:4px 0;min-height:42px}.card small{font-size:12px;opacity:.95}.card .st{font-size:15px;letter-spacing:2px;margin-top:4px;display:block}
.c1{background:linear-gradient(135deg,#7c4dff,#b388ff)}.c2{background:linear-gradient(135deg,#0f8b8d,#34c9c0)}.c3{background:linear-gradient(135deg,#ff6f91,#ffa3b5)}
.c4{background:linear-gradient(135deg,#ff9f43,#ffc971)}.c5{background:linear-gradient(135deg,#2e86de,#74b9ff)}.c6{background:linear-gradient(135deg,#00b894,#55efc4)}.c7{background:linear-gradient(135deg,#e17055,#fab1a0)}
.card:last-child:nth-child(odd){grid-column:1/-1}
.btn{font-family:inherit;border:0;border-radius:16px;padding:12px 18px;font-size:16px;font-weight:800;cursor:pointer;background:var(--teal);color:#fff;box-shadow:0 5px 0 #0a6466;transition:.1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0a6466}.btn.g{background:var(--gold);color:#4a2d00;box-shadow:0 5px 0 #c98f12}.btn.w{background:#fff;color:var(--navy);box-shadow:0 5px 0 #cfd8dc}
.back{background:#fff;border:0;border-radius:14px;padding:8px 14px;font-family:inherit;font-weight:800;color:var(--navy);box-shadow:0 3px 8px rgba(0,0,0,.08);cursor:pointer;margin-bottom:10px}
.links{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.chead{border-radius:24px;padding:16px;color:#fff;margin-bottom:12px;box-shadow:0 8px 18px rgba(0,0,0,.14)}.chead .em{font-size:44px}.chead h1{font-size:22px;font-weight:900}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:12px 14px;margin:8px 0;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.06);border:0;width:100%;font-family:inherit;text-align:right;color:var(--navy)}
.row .n{width:38px;height:38px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--teal);flex:none}
.row b{flex:1;font-size:15px}.row small{opacity:.65;display:block;font-weight:400;font-size:12px}
.ref{background:#fffbe8;border:2px dashed var(--gold);border-radius:20px;padding:12px 14px}.ref li{margin:6px 22px 6px 0;line-height:1.7;font-size:14.5px}.ref h3{font-size:16px}
.qbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.prog{flex:1;height:12px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.1)}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--mint));border-radius:10px;transition:.3s}
.pill{background:#fff;border-radius:12px;padding:4px 10px;font-weight:800;font-size:13px}.pill.t{background:#ffefef;color:#d6304f}
.q{background:#fff;border-radius:24px;padding:20px 16px;font-size:19px;font-weight:800;line-height:1.8;box-shadow:0 8px 20px rgba(0,0,0,.08);margin-bottom:12px;border-top:6px solid var(--tc,var(--teal))}
.opt{display:block;width:100%;text-align:right;background:#fff;border:2.5px solid #d8e6e6;border-radius:18px;padding:13px 14px;margin:9px 0;font-family:inherit;font-size:17px;font-weight:600;color:var(--navy);cursor:pointer;transition:.12s}
.opt:active{transform:scale(.98)}.opt.ok{background:#d9f7e4;border-color:#22b866}.opt.no{background:#ffe0e6;border-color:#f0506e}.opt.dim{opacity:.55}
.ex{background:#e8f6ff;border-radius:18px;padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.8;border-right:5px solid #2e86de}
.res{background:#fff;border-radius:28px;padding:24px 16px;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.1)}
.res .big{font-size:60px;letter-spacing:6px}.res h1{font-size:26px;font-weight:900;margin:6px 0}.res .sc{font-size:44px;font-weight:900;color:var(--teal)}
.mis{background:#fff;border-radius:18px;padding:12px 14px;margin:8px 0;border-right:5px solid #f0506e;font-size:14.5px;line-height:1.8}.mis b{color:#d6304f}.mis em{color:#1a9a55;font-style:normal;font-weight:800}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.cert{background:#fffdf6;border:10px double var(--gold);border-radius:12px;padding:24px 16px;text-align:center;margin-top:12px}
.cert h1{font-size:30px;font-weight:900;color:var(--teal)}.cert .nm{font-size:26px;font-weight:900;border-bottom:3px dotted var(--gold);display:inline-block;padding:0 20px;margin:10px 0;min-width:200px}
.sig{display:flex;justify-content:space-around;margin-top:18px;font-size:14px}.sig b{display:block;color:var(--teal)}
input.name{font-family:inherit;font-size:18px;padding:10px;border-radius:14px;border:2px solid var(--gold);text-align:center;width:80%}
.pbox{background:#fff;border-radius:20px;padding:14px;margin:8px 0;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.pbox .h{display:flex;justify-content:space-between;font-weight:800;font-size:15px}.bar{height:12px;background:#e9f1f1;border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--mint))}
.about p{line-height:1.9;font-size:15.5px}.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.feat div{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 12px rgba(0,0,0,.06);font-size:14px;line-height:1.6}.feat b{display:block;font-size:15px;color:var(--teal)}
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;font-size:14px}table.t td,table.t th{padding:8px 10px;border-bottom:1px solid #e9f1f1;text-align:right}table.t th{background:var(--teal);color:#fff}
.foot{text-align:center;font-size:12px;opacity:.65;margin-top:22px;line-height:1.8}
sub,sup{font-size:.7em}
@media print{body{background:#fff}.bubbles,.noprint{display:none!important}.pbox,.feat div,table.t{box-shadow:none}}
</style></head><body>

<script>
const D=[{"n": 1, "name": "الإلكترونات في الذرات", "ref": ["سرعة الضوء c = 3.00 × 10^8^ m/s، والعلاقة c = λν", "طاقة الفوتون E = hν حيث h = 6.626 × 10^−34^ J·s", "عدد الأوربيتالات: s = 1، p = 3، d = 5، f = 7", "أقصى عدد إلكترونات في مستوى الطاقة n هو 2n^2^", "ترتيب الملء: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s", "المبادئ: أوفباو (الأقل طاقة أولاً)، باولي (إلكترونان بغزلين متعاكسين)، هوند (الانفراد قبل التزاوج)"], "lessons": [{"name": "1-1 الضوء وطاقة الكم", "q": [["سرعة الضوء في الفراغ تساوي", "3.00 × 10^8^ m/s", "3.00 × 10^6^ m/s", "3.00 × 10^10^ m/s", "3.00 × 10^5^ m/s", "سرعة جميع الأمواج الكهرومغناطيسية في الفراغ ثابتة: c = 3.00 × 10^8^ m/s."], ["العلاقة بين سرعة الضوء والطول الموجي والتردد:", "c = λν", "c = λ ÷ ν", "c = ν ÷ λ", "c = λ + ν", "سرعة الموجة = الطول الموجي × التردد."], ["وحدة التردد هي:", "هرتز (Hz)", "متر (m)", "جول (J)", "متر/ثانية (m/s)", "التردد عدد الموجات في الثانية، والهرتز يساوي 1/s."], ["العلاقة بين الطول الموجي والتردد لموجة كهرومغناطيسية:", "عكسية", "طردية", "لا علاقة بينهما", "متساوية دائماً", "لأن c ثابتة، إذا زاد أحدهما قلّ الآخر."], ["أي ألوان الضوء المرئي له أطول طول موجي؟", "الأحمر", "البنفسجي", "الأخضر", "الأزرق", "الأحمر أطول طول موجي وأقل تردد، والبنفسجي العكس."], ["أي الأشعة التالية لها أعلى طاقة؟", "أشعة جاما", "الأشعة تحت الحمراء", "موجات الراديو", "الميكروويف", "أشعة جاما لها أعلى تردد وبالتالي أعلى طاقة."], ["معادلة بلانك لطاقة الكم:", "E = hν", "E = h ÷ ν", "E = ν ÷ h", "E = h + ν", "طاقة الكم تساوي ثابت بلانك × التردد."], ["قيمة ثابت بلانك h:", "6.626 × 10^−34^ J·s", "6.626 × 10^34^ J·s", "3.00 × 10^8^ J·s", "1.602 × 10^−19^ J·s", "h = 6.626 × 10^−34^ J·s."], ["الجسيم الذي لا كتلة له ويحمل كمّاً من الطاقة الضوئية:", "الفوتون", "الإلكترون", "البروتون", "النيوترون", "الفوتون جسيم ضوئي لا كتلة له وطاقته E = hν."], ["التأثير الكهروضوئي هو:", "انبعاث إلكترونات من سطح فلز عند سقوط ضوء بتردد مناسب عليه", "انعكاس الضوء عن سطح الفلز", "امتصاص الفلز للحرارة", "توصيل الفلز للتيار الكهربائي", "فسّره أينشتاين بأن الضوء يتكون من فوتونات."] function startQ(id){
 clr();let pool,label,ci=-1,time=0;
 if(id==='grand'){pool=sh(D.flatMap((c,i)=>sh(allQ(c)).slice(0,5).map(q=>[...q,i]))).slice(0,25);label='التحدي الأكبر'}
 else if(id==='mock'){pool=sh(D.flatMap((c,i)=>sh(allQ(c)).slice(0,5).map(q=>[...q,i]))).slice(0,30);label='التحصيلي التجريبي';time=1800}
 else if(id==='daily'){const r=rng('chem'+today());pool=sh(ALL,r).slice(0,10);label='التحدي اليومي · '+today()}
 else if(id==='hard'){const h=X.wrong.filter(t=>BYTXT[t]).map(t=>BYTXT[t]);if(!h.length){alert('ما عندك أسئلة صعبة بعد! العبي جولة وستُحفظ هنا الأسئلة التي تخطئين فيها.');return}pool=sh(h).slice(0,15);label='أسئلتي الصعبة'}
 else{const m=id.match(/^c(\d)(?:l(\d))?$/);ci=+m[1]-1;const c=D[ci];
  if(m[2]!==undefined){const l=c.lessons[+m[2]];pool=sh(l.q).slice(0,10).map(q=>[...q,ci]);label=l.name}
  else{pool=sh(allQ(c)).slice(0,15).map(q=>[...q,ci]);label='الفصل '+c.n+': '+c.name}}
 R={id,label,pool,i:0,ok:0,wrong:[],ci,done:false,left:time};
 if(time){timer=setInterval(()=>{R.left--;const e=$('tm');if(e)e.textContent=Math.floor(R.left/60)+':'+pad(R.left%60);if(R.left<=0){clr();fin(true)}},1000)}
 show()}
const leave=()=>{clr();R&&R.ci>=0?chap(R.ci):home()};
function show(){
 const q=R.pool[R.i],opts=sh(q.slice(1,5)),tc=COL[q[6]];
 app.innerHTML=`<button class="back" onclick="leave()">→ خروج</button>
 <div class="qbar"><span class="pill">${R.i+1} / ${R.pool.length}</span><div class="prog"><i style="width:${R.i/R.pool.length*100}%"></i></div>${R.left?`<span class="pill t">⏱ <span id="tm">${Math.floor(R.left/60)}:${pad(R.left%60)}</span></span>`:''}<span class="pill">✅ ${R.ok}</span></div>
 <div class="q" style="--tc:${tc}" dir="auto">${fm(q[0])}</div><div id="opts">${opts.map(o=>`<button class="opt" dir="auto">${fm(o)}</button>`).join('')}</div><div id="fb"></div>`;
 document.querySelectorAll('.opt').forEach((b,k)=>b.onclick=()=>pick(b,opts[k],q));scrollTo(0,0)}
function pick(b,v,q){
 if(R.done)return;R.done=true;const ok=v===q[1];
 document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x===b)x.classList.add(ok?'ok':'no');else x.classList.add('dim')});
 document.querySelectorAll('.opt').forEach(x=>{if(x.innerHTML===fm(q[1])){x.classList.remove('dim');x.classList.add('ok')}});
 const st=X.stat[q[6]]=X.stat[q[6]]||{a:0,c:0};st.a++;
 if(ok){R.ok++;st.c++;X.wrong=X.wrong.filter(t=>t!==q[0])}
 else{R.wrong.push({q:q[0],r:q[1],y:v,e:q[5]});if(!X.wrong.includes(q[0]))X.wrong.push(q[0])}
 save();
 $('fb').innerHTML=`<div class="ex" dir="auto">${ok?'🎉 <b>أحسنتِ!</b>':'💡 <b>الإجابة الصحيحة:</b> '+fm(q[1])}<br>${fm(q[5])}</div><div class="btns"><button class="btn g" onclick="nx()">${R.i+1<R.pool.length?'السؤال التالي ←':'النتيجة 🏁'}</button></div>`;
 $('fb').scrollIntoView({behavior:'smooth',block:'center'})}
function nx(){R.done=false;R.i++;R.i>=R.pool.length?fin():show()}
function fin(timeUp){
 clr();const total=R.pool.length,p=Math.round(R.ok/total*100),s=p>=90?3:p>=70?2:p>=50?1:0;
 X.rounds++;
 if(!['hard','daily'].includes(R.id)&&s>(S[R.id]||0))S[R.id]=s;
 let streakMsg='';
 if(R.id==='daily'&&X.last!==today()){X.streak=(X.last===yest())?X.streak+1:1;X.last=today();streakMsg=`<div style="font-size:18px;font-weight:800;margin-top:8px">🔥 ${X.streak} ${X.streak===1?'يوم':'أيام متتالية'}!</div>`}
 save();
 const msg=s==3?'مبدعة! إتقان كامل 🏆':s==2?'ممتاز! قريبة جداً من الإتقان 💪':s==1?'جيد، راجعي الأخطاء وأعيدي المحاولة 🌱':'لا تقلقي، المراجعة تصنع الإتقان 📚';
 let h=`<div class="res"><div class="big">${stars(s)}</div><h1>${timeUp?'انتهى الوقت ⏱️':msg}</h1><div class="sc">${R.ok} / ${total}</div><div>${p}% · ${R.label}</div>${streakMsg}</div>`;
 if(R.wrong.length){h+=`<h2>🔍 راجعي أخطاءك <small style="font-weight:400;font-size:13px">(حُفظت في «أسئلتي الصعبة»)</small></h2>`+R.wrong.map(w=>`<div class="mis" dir="auto">${fm(w.q)}<br>إجابتك: <b>${fm(w.y)}</b><br>الصحيحة: <em>${fm(w.r)}</em><br>${fm(w.e)}</div>`).join('')}
 h+=`<div class="btns noprint">`;
 if(R.id!=='daily')h+=`<button class="btn g" onclick="startQ('${R.id}')">🔄 جولة جديدة</button>`;
 if(p>=80)h+=`<button class="btn" onclick="cert()">🏅 شهادتي</button>`;
 h+=`<button class="btn w" onclick="leave()">رجوع</button></div>`;
 app.innerHTML=h;scrollTo(0,0);R._fin=true}
function cert(){
 app.innerHTML=`<div class="noprint"><button class="back" onclick="fin()">→ رجوع</button><div style="text-align:center;margin:10px"><input class="name" id="nm" placeholder="اكتبي اسمك" oninput="$('cn').textContent=this.value||'................'"></div></div>
 <div class="cert"><div style="font-size:50px">🏅</div><h1>شهادة تميّز في الكيمياء</h1><div>تُمنح الطالبة</div><div class="nm" id="cn">................</div>
 <div style="font-size:16px;line-height:1.9">لتفوقها في «${R.label}»<br>بنتيجة ${R.ok} من ${R.pool.length} في لعبة مختبر التحدّي – نحو التفوّق التحصيلي<br>الثانوية ١٠٣</div>
 <div class="sig"><div><b>معلمة المادة</b>آمنة المالكي</div><div><b>مديرة المدرسة</b>أمل الشمراني</div></div></div>
 <div class="btns noprint"><button class="btn g" onclick="print()">🖨️ طباعة / حفظ PDF</button></div>`;scrollTo(0,0)}
function prog(){
 let ans=0,cor=0;Object.values(X.stat).forEach(s=>{ans+=s.a;cor+=s.c});
 let h=`<button class="back" onclick="home()">→ الرئيسية</button><h2>📊 تقدّمي</h2>
 <div class="stats"><div class="stat"><b>${totalStars()}</b><span>⭐ نجوم</span></div><div class="stat"><b>${ans}</b><span>سؤال أجبتِ عنه</span></div><div class="stat"><b>${ans?Math.round(cor/ans*100):0}%</b><span>الدقة</span></div></div>
 <div class="stats"><div class="stat"><b>${streakNow()}</b><span>🔥 أيام متتالية</span></div><div class="stat"><b>${X.rounds}</b><span>جولة</span></div><div class="stat"><b>${X.wrong.filter(t=>BYTXT[t]).length}</b><span>أسئلة صعبة</span></div></div>`;
 D.forEach((c,i)=>{const s=X.stat[i]||{a:0,c:0},p=s.a?Math.round(s.c/s.a*100):0;
  h+=`<div class="pbox"><div class="h"><span>${ICON[i]} الفصل ${c.n}: ${c.name}</span><span>${stars(best('c'+c.n))}</span></div><div style="font-size:13px;opacity:.7;margin-top:4px">${s.a?`الدقة ${p}% · ${s.a} سؤالاً`:'لم تبدئي بعد'}</div><div class="bar"><i style="width:${p}%;background:${COL[i]}"></i></div></div>`});
 h+=`<div class="foot">التقدّم محفوظ في جوالك أنتِ، ولا يظهر لغيرك.</div>`;
 app.innerHTML=h;scrollTo(0,0)}
function about(){
 let rows=D.map((c,i)=>`<tr><td>${ICON[i]} ${c.n}</td><td>${c.name}</td><td>${c.lessons.length}</td><td>${allQ(c).length}</td></tr>`).join('');
 app.innerHTML=`<button class="back" onclick="home()">→ الرئيسية</button><div class="about"><h2>ℹ️ عن المنصة</h2>
 <p><b>مختبر التحدّي: نحو التفوّق التحصيلي</b> منصة تدريب تفاعلية لمادة الكيمياء في المرحلة الثانوية، تُعدّ الطالبة لاختبار التحصيلي وتدعم رفع نواتج التعلّم، وتخدمها طوال العام الدراسي. تعمل من الجوال بدون تسجيل ولا تحميل.</p>
 <h2>✨ مميزاتها</h2><div class="feat">
 <div><b>📚 ${totalQ} سؤالاً</b>على الفصول السبعة بنمط التحصيلي، مع شرح بعد كل سؤال.</div>
 <div><b>📌 مراجعات سريعة</b>لقوانين وقواعد كل فصل قبل التدريب.</div>
 <div><b>🔥 تحدٍّ يومي</b>١٠ أسئلة جديدة كل يوم لبناء عادة المراجعة.</div>
 <div><b>⏱️ تحصيلي تجريبي</b>٣٠ سؤالاً بوقت محدد لمحاكاة الاختبار.</div>
 <div><b>🎯 أسئلتي الصعبة</b>تحفظ ما أخطأت فيه الطالبة وتعيده لها حتى تتقنه.</div>
 <div><b>📊 تقدّمي</b>تعرض دقتها في كل فصل لتعرف نقاط قوتها وضعفها.</div>
 <div><b>⭐ نجوم وشهادات</b>تحفّز الطالبة وتكافئ الإتقان (٨٠٪ فأكثر).</div>
 <div><b>🧪 دروس الكتاب</b>كل فصل مقسّم بحسب دروس الكتاب المدرسي.</div></div>
 <h2>🗂️ المحتوى</h2><table class="t"><tr><th>#</th><th>الفصل</th><th>الدروس</th><th>الأسئلة</th></tr>${rows}<tr><td></td><td><b>المجموع</b></td><td>${D.reduce((a,c)=>a+c.lessons.length,0)}</td><td><b>${totalQ}</b></td></tr></table>
 <h2>🎯 كيف تخدم الطالبة طوال العام؟</h2>
 <p>تُستخدم مع كل فصل أثناء الدراسة، وقبل الاختبارات، ثم في المراجعة الشاملة قبل التحصيلي. وتناسب الطالبات في جميع صفوف المرحلة الثانوية.</p>
 <div class="names" style="margin-top:14px"><div style="background:#fff;border:1px solid #d8e6e6;color:var(--navy)">👩‍🏫 معلمة المادة: <b style="color:var(--teal)">آمنة المالكي</b></div><div style="background:#fff;border:1px solid #d8e6e6;color:var(--navy)">🌟 مديرة المدرسة: <b style="color:var(--teal)">أمل الشمراني</b></div></div>
 <div class="btns noprint"><button class="btn g" onclick="print()">🖨️ طباعة الصفحة</button></div></div>`;scrollTo(0,0)}
home();
</script></body></html>
